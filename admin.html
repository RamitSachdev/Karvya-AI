<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Karvya AI</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script type="module" src="/src/admin.js"></script>
</head>
<body class="app admin">
  <header class="admin-bar">
    <a class="logo" href="/" aria-label="Karvya AI home"><svg class="logo-mark" viewBox="0 0 40 50" aria-hidden="true"><g class="s"><circle cx="5" cy="5" r="4.4"/><circle cx="5" cy="15" r="4.4"/><circle cx="5" cy="25" r="4.4"/><circle cx="5" cy="35" r="4.4"/><circle cx="5" cy="45" r="4.4"/></g><g class="a"><circle cx="35" cy="5" r="4.4"/><circle cx="25" cy="15" r="4.4"/><circle cx="15" cy="25" r="4.4"/><circle cx="25" cy="35" r="4.4"/><circle cx="35" cy="45" r="4.4"/></g></svg><span>Karvya<em>AI</em></span></a>
    <span>Trial requests</span>
  </header>
  <main class="admin-main">
    <form class="app-card" data-login hidden>
      <h1>Sign in</h1>
      <p>Enter your admin token. It’s the <code>ADMIN_TOKEN</code> value in your environment settings.</p>
      <label for="token">Admin token</label>
      <input class="input" id="token" type="password" autocomplete="current-password" required />
      <p class="error" data-login-error hidden></p>
      <button class="btn btn-ink" type="submit">Sign in</button>
    </form>
    <div data-board hidden>
      <div class="admin-tabs" role="group" aria-label="Filter by status" data-tabs></div>
      <p class="admin-spend" data-spend hidden></p>
      <p class="banner" data-board-error role="alert" hidden></p>
      <ul class="admin-leads" data-leads></ul>
      <p class="app-empty admin-empty" data-leads-empty hidden>No requests here.</p>
    </div>
  </main>
</body>
</html>
